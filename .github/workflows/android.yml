name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Web-Build
        run: |
          npm ci
          npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Debug-APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "gatebreaker-${VERSION}-debug.apk"
          echo "APK=gatebreaker-${VERSION}-debug.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: gatebreaker-debug-apk
          path: ${{ env.APK }}

      - name: GitHub Release (nur bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          name: Gatebreaker ${{ github.ref_name }}
          body: |
            Spielbarer Android-Prototyp (Debug-APK, mit Debug-Schlüssel signiert).
            Installation: APK auf dem Handy herunterladen, öffnen und „Installation aus unbekannten Quellen“ erlauben.
